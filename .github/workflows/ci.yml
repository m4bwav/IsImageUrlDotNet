# Every push to master and every pull request: locked restore, Fantomas and dotnet format checks, build with warnings
# as errors, the golden, unit, public-API and C# tests on Linux, macOS and Windows (net10.0 everywhere; net48 on
# Windows, which runs the netstandard2.0 build), a pack with a content check, a fresh C# consumer of the packed package,
# and the final `ci` job the ruleset on master requires. Publishing is release.yml. Actions are pinned to commit SHAs;
# Dependabot updates them.
name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build:
    name: build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Source Link records the commit
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - run: dotnet restore --locked-mode
      - run: dotnet tool restore
      # F# is checked by Fantomas; dotnet format skips F# projects and exits 0, so it only checks the C# tests.
      - run: dotnet fantomas --check .
      - run: dotnet format tests/IsImageUrlDotNet.CSharpTests --no-restore --verify-no-changes
      - run: dotnet build --no-restore -c Release
      # G-Research and Ionide analyzers, every finding an error. IsImageUrl.fs is 1.0.2's code kept exactly (D1): its
      # `| null | "" ->` trips IONIDE-005, and changing it is what the golden test forbids, so that file is excluded.
      - name: F# analyzers
        if: runner.os == 'Linux'
        run: |
          gp=$(dotnet nuget locals global-packages --list | sed 's/^global-packages: //')
          dotnet fsharp-analyzers --project src/IsImageUrlDotNet/IsImageUrlDotNet.fsproj \
            --analyzers-path "${gp}g-research.fsharp.analyzers/0.25.0/analyzers/dotnet/fs" \
            --analyzers-path "${gp}ionide.analyzers/0.19.0/analyzers/dotnet/fs" \
            --treat-as-error '*' --exclude-files '**/IsImageUrl.fs'
      # A dedicated restore that fails on any audit finding, so a future advisory blocks a merge but not a local build.
      - name: NuGet audit as errors
        run: dotnet restore -p:AuditPipeline=true --force
      - name: Test (net10.0)
        run: dotnet test --no-build -c Release -f net10.0 --logger trx --results-directory TestResults
      - name: Test (net48, Windows only; exercises the netstandard2.0 build)
        if: runner.os == 'Windows'
        run: dotnet test --no-build -c Release -f net48 --logger trx --results-directory TestResults
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults
          retention-days: 30
      - name: Pack
        run: dotnet pack src/IsImageUrlDotNet --no-build -c Release -o artifacts
      - name: The package holds exactly what it should and declares FSharp.Core
        if: runner.os == 'Linux'
        run: |
          nupkg=$(ls artifacts/IsImageUrlDotNet.[0-9]*.nupkg | grep -v snupkg)
          expected=$'IsImageUrlDotNet.nuspec\nREADME.md\nicon.png\nlib/net10.0/IsImageUrlDotNet.dll\nlib/net10.0/IsImageUrlDotNet.xml\nlib/netstandard2.0/IsImageUrlDotNet.dll\nlib/netstandard2.0/IsImageUrlDotNet.xml'
          actual=$(unzip -Z1 "$nupkg" | grep -Ev '^(_rels/|package/|\[Content_Types\])' | sort)
          if [ "$actual" != "$expected" ]; then
            echo "::error::unexpected package contents"
            diff <(echo "$expected") <(echo "$actual")
            exit 1
          fi
          nuspec=$(unzip -p "$nupkg" IsImageUrlDotNet.nuspec)
          for tfm in .NETStandard2.0 net10.0; do
            echo "$nuspec" | tr -d '\n' | grep -Eq "<group targetFramework=\"$tfm\">[[:space:]]*<dependency id=\"FSharp.Core\" version=\"6.0.7\"" \
              || { echo "::error::no FSharp.Core 6.0.7 dependency for $tfm"; echo "$nuspec"; exit 1; }
          done
      - name: A fresh C# consumer of the packed package (no FSharp.Core of its own)
        run: |
          version=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' src/IsImageUrlDotNet/IsImageUrlDotNet.fsproj)
          dir="$RUNNER_TEMP/consumer"
          mkdir -p "$dir"
          cat > "$dir/Consumer.csproj" <<EOF
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup><OutputType>Exe</OutputType><TargetFramework>net10.0</TargetFramework><NoWarn>CS0618</NoWarn></PropertyGroup>
            <ItemGroup><PackageReference Include="IsImageUrlDotNet" Version="[$version]" /></ItemGroup>
          </Project>
          EOF
          cat > "$dir/Program.cs" <<'EOF'
          using System;
          using IsImageUrlDotNet;

          var ok = "http://example.test/a.png".IsImageUrl()
              && "http://example.test/a.png?w=1".HasImageExtension()
              && !"http://example.test/a.pdf".HasImageExtension();
          Console.WriteLine(ok ? "answers as expected" : "wrong answer");
          return ok ? 0 : 1;
          EOF
          # A nuget.config, not --source twice: SDK 10.0.401 read the second --source URL as a local folder.
          dotnet new nugetconfig -o "$dir"
          # Git Bash on Windows: $PWD is /d/a/..., and `dotnet nuget add source` also refuses D:/a/...; it takes D:\a\...
          artifacts="$PWD/artifacts"
          if command -v cygpath >/dev/null; then artifacts=$(cygpath -w "$artifacts"); fi
          dotnet nuget add source "$artifacts" -n local --configfile "$dir/nuget.config"
          dotnet run --project "$dir"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: runner.os == 'Linux'
        with:
          name: packages
          path: artifacts/*nupkg
          retention-days: 30

  ci:
    name: ci
    if: ${{ always() }}
    needs: [build]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != success ]; then
              exit 1
            fi
          done
